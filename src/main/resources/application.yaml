spring:
  ai:
    openai:
      api-key: ${openai.api-key}
      base-url: https://api.siliconflow.cn
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_chat
    username: root
    password: ${datasource.password}
  data:
    redis:
      host: ${redis.host}
      port: 6379
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
      password: ${redis.password}
  # 导入dev配置
  profiles:
    active: dev

# JWT配置
jwt:
  secret: ${jwt.config.secret}
  expiration: ${jwt.config.expiration}
  token-name: ${jwt.config.token-name}
  refresh-token-name: ${jwt.config.refresh-token-name}
  refresh-expiration: ${jwt.config.refresh-expiration}

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: me.beiming.aichat.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false

server:
  tomcat:
    # 禁用缓冲，立即发送数据
    max-swallow-size: -1
    connection-timeout: 60000
    threads:
      max: 200
    # 关键配置
    max-http-form-post-size: -1
    # 禁用响应缓冲
    accept-count: 100